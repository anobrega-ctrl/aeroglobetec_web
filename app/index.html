<div id="app"><div class="loading full">Cargando…</div></div>
<noscript>Esta plataforma necesita JavaScript activado.</noscript>
<script type="module" src="js/main.js?v=202610180028"></script>
<script>
  // App instalable: el navegador avisa que se puede instalar apenas carga la página,
  // a veces antes que la app. Se guarda el aviso acá para que main.js lo use después.
  window.addEventListener('beforeinstallprompt', (ev) => {
    ev.preventDefault();
    window.__installPrompt = ev;
    window.dispatchEvent(new Event('install-ready'));
  });
  // Service worker (solo funciona en https o localhost)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=202610180028').catch(() => {}));
  }
</script>
</body>
